<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Queuemaxxing</title>
<style>
  :root {
    --bg: #f6f6f4;
    --card: #fff;
    --ink: #1c1c1a;
    --muted: #6a6a64;
    --line: #e4e4de;
    --accent: #1f6feb;
    --ready: #0f7a45;
    --wait: #9a6700;
    --err: #c0352b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121310;
      --card: #1c1d1a;
      --ink: #ecece6;
      --muted: #a3a39a;
      --line: #2e2f2a;
      --accent: #6b93ff;
      --ready: #4eca8a;
      --wait: #e2b35c;
      --err: #ff7a6e;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .page { max-width: 920px; margin: 0 auto; padding: 28px 20px 64px; }

  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 22px;
  }
  h1 { font-size: 20px; margin: 0; font-weight: 700; }
  .meta { margin: 0; color: var(--muted); font-size: 13px; }
  .meta .down { color: var(--err); font-weight: 600; }

  .layout {
    display: grid;
    grid-template-columns: 280px 1fr;
    gap: 20px;
    align-items: start;
  }
  @media (max-width: 720px) { .layout { grid-template-columns: 1fr; } }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 16px 18px;
  }
  h2 { margin: 0 0 12px; font-size: 14px; font-weight: 700; }
  h3 {
    margin: 0 0 8px;
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    display: flex;
    gap: 6px;
  }
  h3 .n { font-variant-numeric: tabular-nums; }

  label { display: block; font-size: 13px; font-weight: 600; margin: 0 0 12px; }
  input, button { font: inherit; color: var(--ink); }
  input {
    display: block;
    width: 100%;
    margin-top: 5px;
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--bg);
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .hint { margin: 10px 0 0; font-size: 12.5px; color: var(--muted); }

  button {
    cursor: pointer;
    border-radius: 8px;
    padding: 8px 12px;
    border: 1px solid var(--line);
    background: var(--bg);
    font-weight: 600;
  }
  button:hover:not(:disabled) { border-color: var(--muted); }
  button:disabled { opacity: .5; cursor: default; }
  .primary {
    width: 100%;
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .primary:hover:not(:disabled) { filter: brightness(1.06); }

  .queue-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 12px;
  }
  .queue-head h2 { margin: 0; }
  .queue-head button { flex: 0 0 auto; }

  .status {
    margin: 0 0 12px;
    font-size: 13.5px;
    color: var(--muted);
  }
  .status.err { color: var(--err); }

  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 560px) { .cols { grid-template-columns: 1fr; } }

  .list { display: flex; flex-direction: column; gap: 8px; max-height: 60vh; overflow: auto; }
  .msg {
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 9px 11px;
    background: var(--bg);
  }
  .msg.next { border-color: var(--ready); }
  .msg .body { word-break: break-word; }
  .msg .meta {
    margin-top: 3px;
    font-size: 12px;
    color: var(--muted);
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .next-tag { color: var(--ready); font-weight: 700; font-size: 11px; letter-spacing: .04em; }
  .eta { color: var(--wait); font-weight: 700; }
  .empty { color: var(--muted); padding: 10px 2px; font-size: 13.5px; }
  .more { font-size: 12.5px; color: var(--muted); margin-top: 6px; }

  details.testing {
    margin-top: 18px;
    border: 1px dashed var(--line);
    border-radius: 10px;
    padding: 8px 14px 12px;
    color: var(--muted);
    font-size: 13px;
  }
  details.testing summary {
    cursor: pointer;
    font-weight: 600;
    color: var(--muted);
    padding: 4px 0;
  }
  .test-note { margin: 8px 0 10px; }
  .test-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 8px; }
  .test-row .lbl {
    font-size: 12px;
    font-weight: 600;
    margin-right: 2px;
    min-width: 72px;
  }
  .test-row button {
    padding: 5px 9px;
    font-size: 12.5px;
    font-weight: 600;
    text-align: left;
  }
  .test-row button i { font-style: normal; font-weight: 500; color: var(--muted); }
  .test-row button.running { border-color: var(--accent); color: var(--accent); }
  #demo-stop {
    display: none;
    padding: 5px 9px;
    font-size: 12.5px;
  }
  #demo-stop.visible { display: inline-block; }
</style>
</head>
<body>
<div class="page">
  <header>
    <h1>Queuemaxxing</h1>
    <p class="meta"><span id="mode">…</span> · <span id="conn">connecting</span></p>
  </header>

  <div class="layout">
    <section class="card">
      <h2>Add a message</h2>
      <form id="enq">
        <label>Message
          <input id="payload" required placeholder="send invoice 42" autocomplete="off">
        </label>
        <div class="row">
          <label>Priority
            <input id="priority" type="number" value="0" step="1">
          </label>
          <label>Delay (seconds)
            <input id="delay" type="number" value="0" min="0" max="315360000" step="1">
          </label>
        </div>
        <button class="primary" type="submit">Add</button>
      </form>
      <p class="hint">Higher priority goes first. A delay keeps the message hidden until it is due.</p>
    </section>

    <section class="card">
      <div class="queue-head">
        <h2>Queue</h2>
        <button type="button" id="deq">Take next</button>
      </div>
      <p class="status" id="status" hidden></p>
      <div class="cols">
        <div>
          <h3>Ready <span class="n" id="c-ready">0</span></h3>
          <div class="list" id="l-ready"></div>
          <div class="more" id="t-ready" hidden></div>
        </div>
        <div>
          <h3>Waiting <span class="n" id="c-delayed">0</span></h3>
          <div class="list" id="l-delayed"></div>
          <div class="more" id="t-delayed" hidden></div>
        </div>
      </div>
    </section>
  </div>

  <details class="testing" open>
    <summary>For testing</summary>
    <p class="test-note">These enqueue sample jobs so you can try the queue without typing.</p>
    <div class="test-row">
      <span class="lbl">Add one</span>
      <button type="button" class="q" data-kind="capture payment for order" data-pri="9" data-delay="0">Payment <i>p9</i></button>
      <button type="button" class="q" data-kind="refund order" data-pri="5" data-delay="0">Refund <i>p5</i></button>
      <button type="button" class="q" data-kind="email receipt for order" data-pri="1" data-delay="0">Receipt <i>p1</i></button>
      <button type="button" class="q" data-kind="retry webhook for order" data-pri="10" data-delay="10">Retry <i>p10, 10s</i></button>
      <button type="button" class="q" data-kind="reindex catalog after order" data-pri="3" data-delay="0">Reindex <i>p3</i></button>
    </div>
    <div class="test-row">
      <span class="lbl">Scenarios</span>
      <button type="button" data-demo="priority">Payments jump the line</button>
      <button type="button" data-demo="delay">The backoff timer</button>
      <button type="button" data-demo="tiebreak">Three identical refunds</button>
      <button type="button" data-demo="checkout">Black Friday checkout</button>
      <button type="button" data-demo="burst">Twenty storefronts at once</button>
      <button type="button" id="demo-stop">Stop</button>
    </div>
  </details>
</div>

<script>
"use strict";

const $ = (id) => document.getElementById(id);

let clockSkewMs = 0;
let snapshot = null;
const demo = { running: false, stop: false };

const serverNow = () => Date.now() + clockSkewMs;

function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
}

function setStatus(text, isError) {
  const el = $("status");
  if (!text) {
    el.hidden = true;
    el.textContent = "";
    return;
  }
  el.hidden = false;
  el.textContent = text;
  el.classList.toggle("err", Boolean(isError));
}

function setConnected(ok) {
  const el = $("conn");
  el.textContent = ok ? "connected" : "server down";
  el.classList.toggle("down", !ok);
  if (!ok) setStatus("Can't reach the server.", true);
  setControlsEnabled(ok);
}

function setControlsEnabled(ok) {
  const busy = demo.running || !ok;
  $("enq").querySelector("button").disabled = busy;
  $("deq").disabled = busy;
  document.querySelectorAll(".testing button").forEach((b) => {
    if (b.id === "demo-stop") return;
    b.disabled = busy;
  });
}

async function api(method, path, body) {
  const opts = { method, headers: {} };
  if (body !== undefined) {
    opts.headers["Content-Type"] = "application/json";
    opts.body = JSON.stringify(body);
  }
  const res = await fetch(path, opts);
  if (res.status === 204) return { status: 204, body: null };
  const text = await res.text();
  let parsed = null;
  try { parsed = text ? JSON.parse(text) : null; } catch (e) { parsed = null; }
  if (!res.ok) {
    throw new Error((parsed && parsed.error) || text || ("HTTP " + res.status));
  }
  return { status: res.status, body: parsed };
}

function messageCard(m, opts) {
  const el = document.createElement("div");
  el.className = "msg" + (opts.next ? " next" : "");
  const bits = ["priority " + esc(m.priority)];
  if (opts.next) bits.unshift('<span class="next-tag">NEXT</span>');
  if (opts.countdown) bits.push('<span class="eta" data-at="' + esc(m.available_at) + '">…</span>');
  el.innerHTML =
    '<div class="body">' + esc(m.payload) + "</div>" +
    '<div class="meta">' + bits.join(" · ") + "</div>";
  return el;
}

function renderList(container, msgs, opts) {
  container.innerHTML = "";
  if (!msgs || msgs.length === 0) {
    const e = document.createElement("div");
    e.className = "empty";
    e.textContent = opts.emptyText;
    container.appendChild(e);
    return;
  }
  msgs.forEach((m, i) => {
    container.appendChild(messageCard(m, {
      next: Boolean(opts.markNext) && i === 0,
      countdown: Boolean(opts.countdown),
    }));
  });
}

function tickCountdowns() {
  const now = serverNow();
  document.querySelectorAll(".eta[data-at]").forEach((el) => {
    const left = new Date(el.dataset.at).getTime() - now;
    el.textContent = left <= 0 ? "due now" : "in " + (left / 1000).toFixed(1) + "s";
  });
}

function render(snap) {
  $("mode").textContent = snap.mode === "LIFO"
    ? "LIFO · newest first"
    : "FIFO · oldest first";
  $("c-ready").textContent = snap.stats.ready;
  $("c-delayed").textContent = snap.stats.delayed;

  renderList($("l-ready"), snap.ready, {
    markNext: true,
    emptyText: "Nothing ready.",
  });
  renderList($("l-delayed"), snap.delayed, {
    countdown: true,
    emptyText: "Nothing waiting.",
  });

  const tr = $("t-ready");
  const td = $("t-delayed");
  tr.hidden = !snap.ready_truncated;
  tr.textContent = snap.ready_truncated
    ? "Showing " + snap.ready.length + " of " + snap.stats.ready : "";
  td.hidden = !snap.delayed_truncated;
  td.textContent = snap.delayed_truncated
    ? "Showing " + snap.delayed.length + " of " + snap.stats.delayed : "";

  tickCountdowns();
}

async function refresh() {
  try {
    const res = await api("GET", "/messages?limit=200");
    clockSkewMs = new Date(res.body.now).getTime() - Date.now();
    snapshot = res.body;
    render(snapshot);
    setConnected(true);
    if ($("status").classList.contains("err") && $("status").textContent === "Can't reach the server.") {
      setStatus("");
    }
  } catch (err) {
    setConnected(false);
  }
}

async function addJob(payload, priority, delaySeconds) {
  await api("POST", "/enqueue", {
    payload: payload, priority: priority, delay_seconds: delaySeconds,
  });
}

$("enq").addEventListener("submit", async (e) => {
  e.preventDefault();
  const payload = $("payload").value;
  const priority = Number($("priority").value || 0);
  const delaySeconds = Number($("delay").value || 0);
  try {
    await addJob(payload, priority, delaySeconds);
    $("payload").value = "";
    $("payload").focus();
    setStatus(delaySeconds > 0
      ? "Added. Waiting " + delaySeconds + "s."
      : "Added.");
  } catch (err) {
    setStatus(err.message, true);
  }
  refresh();
});

let nextOrder = 1841;
document.querySelectorAll(".q").forEach((b) => {
  b.addEventListener("click", async () => {
    const delaySeconds = Number(b.dataset.delay || 0);
    try {
      await addJob(b.dataset.kind + " " + nextOrder++, Number(b.dataset.pri || 0), delaySeconds);
      setStatus(delaySeconds > 0
        ? "Added test job. Waiting " + delaySeconds + "s."
        : "Added test job.");
    } catch (err) {
      setStatus(err.message, true);
    }
    refresh();
  });
});

function shortPayload(s, n) {
  s = String(s);
  return s.length > n ? s.slice(0, n - 1) + "…" : s;
}

function cmpFor(mode) {
  return (a, b) => {
    if (a.priority !== b.priority) return b.priority - a.priority;
    return mode === "LIFO" ? b.seq - a.seq : a.seq - b.seq;
  };
}

function simulateDrain(snap, mode, popEveryMs) {
  const step = popEveryMs || 0;
  const cmp = cmpFor(mode);
  const ready = snap.ready.slice();
  const delayed = snap.delayed
    .map((m) => ({ m, at: new Date(m.available_at).getTime() }))
    .sort((x, y) => x.at - y.at);
  let t = new Date(snap.now).getTime();
  const out = [];
  while (ready.length > 0 || delayed.length > 0) {
    while (delayed.length > 0 && delayed[0].at <= t) ready.push(delayed.shift().m);
    if (ready.length === 0) { t = delayed[0].at; continue; }
    ready.sort(cmp);
    out.push({ m: ready.shift(), atMs: t });
    t += step;
  }
  return out;
}

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const DEMO_POP_MS = 1100;

const DEMOS = {
  priority: {
    title: "Payments jump the line",
    items: [
      { payload: "email receipt for order 1841", priority: 1, delay_seconds: 0 },
      { payload: "capture $420 card payment for order 1842", priority: 9, delay_seconds: 0 },
      { payload: "reindex the catalog after a price change", priority: 5, delay_seconds: 0 },
    ],
  },
  delay: {
    title: "The backoff timer",
    items: [
      { payload: "retry Stripe webhook for order 1842 (backoff 8s)", priority: 9, delay_seconds: 8 },
      { payload: "purge expired carts (nightly cleanup)", priority: 1, delay_seconds: 0 },
    ],
  },
  tiebreak: {
    title: "Three identical refunds",
    items: [
      { payload: "refund order 1841 (arrived first)", priority: 5, delay_seconds: 0 },
      { payload: "refund order 1842 (arrived second)", priority: 5, delay_seconds: 0 },
      { payload: "refund order 1843 (arrived third)", priority: 5, delay_seconds: 0 },
    ],
  },
  checkout: {
    title: "Black Friday checkout",
    items: [
      { payload: "email receipt for order 1841", priority: 1, delay_seconds: 0 },
      { payload: "capture payment for order 1842", priority: 5, delay_seconds: 0 },
      { payload: "retry Stripe webhook for order 1842", priority: 10, delay_seconds: 8 },
      { payload: "capture payment for order 1843", priority: 5, delay_seconds: 0 },
      { payload: "retry inventory webhook for order 1843", priority: 10, delay_seconds: 4 },
    ],
  },
};

function setDemoUI(runningKey) {
  document.querySelectorAll("[data-demo]").forEach((b) => {
    b.classList.toggle("running", b.dataset.demo === runningKey);
  });
  $("demo-stop").classList.toggle("visible", Boolean(runningKey));
  setControlsEnabled(true);
}

$("demo-stop").addEventListener("click", () => { demo.stop = true; });

document.querySelectorAll("[data-demo]").forEach((b) => {
  b.addEventListener("click", () => {
    if (demo.running) return;
    if (b.dataset.demo === "burst") runBurstDemo();
    else runDemo(b.dataset.demo);
  });
});

async function runDemo(key) {
  const def = DEMOS[key];
  demo.running = true;
  demo.stop = false;
  setDemoUI(key);
  try {
    setStatus("Scenario: " + def.title);
    const mine = new Map();
    for (const item of def.items) {
      const res = await api("POST", "/enqueue", item);
      mine.set(res.body.id, res.body);
    }

    await refresh();
    if (!snapshot) throw new Error("no snapshot, is the server up?");
    const predicted = simulateDrain(snapshot, snapshot.mode, DEMO_POP_MS)
      .filter((e) => mine.has(e.m.id))
      .map((e) => e.m);
    setStatus("Predicted: " + predicted.map((m) => shortPayload(m.payload, 28)).join(" → "));

    const actual = [];
    const deadline = Date.now() + 45000;
    while (actual.length < mine.size && !demo.stop && Date.now() < deadline) {
      const res = await api("POST", "/dequeue");
      if (res.status === 204) {
        setStatus("Waiting for a delayed job…");
        await sleep(1000); await refresh();
        continue;
      }
      const m = res.body;
      if (mine.has(m.id)) actual.push(m);
      setStatus("Took: " + m.payload);
      await refresh();
      await sleep(DEMO_POP_MS);
    }

    if (demo.stop) {
      setStatus("Scenario stopped. Remaining jobs are still in the queue.");
    } else if (actual.length < mine.size) {
      setStatus("Scenario timed out. Remaining jobs are still in the queue.", true);
    } else {
      const ok = actual.length === predicted.length && actual.every((m, i) => m.id === predicted[i].id);
      const order = actual.map((m) => shortPayload(m.payload, 22)).join(" → ");
      setStatus(ok ? "PASS. " + order : "Order differed: " + order, !ok);
    }
  } catch (err) {
    setStatus(err.message, true);
  } finally {
    demo.running = false;
    demo.stop = false;
    setDemoUI(null);
    refresh();
  }
}

async function runBurstDemo() {
  demo.running = true;
  demo.stop = false;
  setDemoUI("burst");
  try {
    setStatus("Scenario: Twenty storefronts at once");
    const reqs = [];
    for (let i = 1; i <= 20; i++) {
      reqs.push(api("POST", "/enqueue", {
        payload: "order from storefront #" + i,
        priority: i % 5,
        delay_seconds: 0,
      }));
    }
    const results = await Promise.all(reqs);
    const seqs = results.map((r) => r.body.seq);
    const unique = new Set(seqs).size === seqs.length;
    if (!unique) {
      setStatus("Duplicate sequence numbers.", true);
      return;
    }
    setStatus("All 20 accepted. Draining…");
    await refresh();
    await sleep(800);

    let n = 0;
    while (!demo.stop) {
      const res = await api("POST", "/dequeue");
      if (res.status === 204) break;
      n++;
      if (n > 5000) break;
    }
    setStatus(unique ? "PASS. 20 unique jobs, drained " + n + "." : "Duplicate sequence numbers.");
  } catch (err) {
    setStatus(err.message, true);
  } finally {
    demo.running = false;
    demo.stop = false;
    setDemoUI(null);
    refresh();
  }
}

$("deq").addEventListener("click", async () => {
  const delayed = snapshot ? snapshot.stats.delayed : 0;
  try {
    const res = await api("POST", "/dequeue");
    if (res.status === 204) {
      setStatus(delayed > 0
        ? "Nothing ready. " + delayed + " still waiting."
        : "Queue is empty.");
    } else {
      setStatus("Took: " + res.body.payload);
    }
  } catch (err) {
    setStatus(err.message, true);
  }
  refresh();
});

setInterval(tickCountdowns, 100);
setInterval(refresh, 1000);
refresh();
</script>
</body>
</html>
